# Build the minimal NaiveProxy-REALITY Envoy server on GitHub Actions.
#
# Why this exists: DigitalOcean restricted our account to small droplets, and a
# 4c/8g box OOMs on Envoy. GitHub-hosted runners (4 vCPU / 16 GB) plus the
# official envoy-build image are a reliable, free alternative and are exactly
# what upstream CI uses.
#
# What it builds: //source/exe:envoy-static with our minimal extension allowlist
# (bazel/naive_build_config, registered via WORKSPACE) and wasm disabled, then
# strips it and uploads envoy-min as an artifact.
#
# Trigger: push to a branch, or manually via the Actions tab (workflow_dispatch).
#
# NOTE: this repo must contain your uncommitted plugin + patches COMMITTED in
# (they are working-tree changes today). Commit them before pushing, otherwise
# CI checks out a tree without your naive_forward_proxy filter / reality
# handshaker / boringssl-reality.patch / naive proto.

name: build-naive-server

on:
  workflow_dispatch:
    inputs:
      compile_mode:
        description: "bazel -c mode"
        default: "opt"
        type: choice
        options: [opt, fastbuild]
  push:
    branches: ["build-naive-*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # under the 360-min hard cap
    steps:
      - name: Checkout (with your committed plugin + patches)
        uses: actions/checkout@v4

      # Envoy's full build tree + bazel cache easily exceeds the ~14 GB free on
      # a stock runner. Reclaim ~25 GB by removing preinstalled toolchains we
      # don't need.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
                      /usr/lib/jvm || true
          sudo docker image prune --all --force || true
          df -h /

      # The official envoy build image has a custom entrypoint that sets up the
      # envoybuild user and /build mount, then runs $DOCKER_COMMAND as that
      # user. We MUST go through ci/run_envoy_docker.sh instead of a raw
      # `docker run`, otherwise the container exits immediately (exit 3).
      # The docker build dir (mapped to /build inside) holds the bazel caches;
      # we cache it on the host so reruns are faster.
      - name: Cache bazel build dir (disk + repo cache)
        uses: actions/cache@v4
        with:
          path: /tmp/envoy-docker-build
          key: bazel-${{ runner.os }}-${{ hashFiles('bazel/repository_locations.bzl', '.bazelversion', 'WORKSPACE') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Build envoy-static (minimal allowlist, wasm disabled)
        env:
          COMPILE_MODE: ${{ github.event.inputs.compile_mode || 'opt' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/envoy-docker-build
          # Run inside the official image via the official wrapper. Bazel caches
          # live under /build (the mounted ENVOY_DOCKER_BUILD_DIR). --jobs modest
          # so link actions don't OOM on a 16 GB runner.
          # strip into /build (writable by the envoybuild user and mounted to
          # the host at /tmp/envoy-docker-build); copying to /source (repo root)
          # can fail on permissions. We fetch it from the host mount afterwards.
          ./ci/run_envoy_docker.sh "
            bazel build \
              --config=clang \
              --disk_cache=/build/bazel-disk \
              --repository_cache=/build/bazel-repo \
              --jobs=4 \
              --local_ram_resources=13000 \
              --define=wasm=disabled \
              --define=hot_restart=disabled \
              --define=admin_html=disabled \
              --define=signal_trace=disabled \
              --define=deprecated_features=disabled \
              -c ${COMPILE_MODE} \
              //source/exe:envoy-static \
            && strip -s bazel-bin/source/exe/envoy-static -o /build/envoy-min \
            && /build/envoy-min --version \
            && ls -lh /build/envoy-min"
          # /build inside the container == /tmp/envoy-docker-build on the host.
          cp /tmp/envoy-docker-build/envoy-min ./envoy-min
          ls -lh envoy-min

      - name: Upload envoy-min artifact
        uses: actions/upload-artifact@v4
        with:
          name: envoy-min-${{ github.sha }}
          path: envoy-min
          if-no-files-found: error
          retention-days: 14
