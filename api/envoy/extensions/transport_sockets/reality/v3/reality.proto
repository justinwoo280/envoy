syntax = "proto3";

package envoy.extensions.transport_sockets.reality.v3;

import "udpa/annotations/status.proto";

option java_package = "io.envoyproxy.envoy.extensions.transport_sockets.reality.v3";
option java_outer_classname = "RealityProto";
option java_multiple_files = true;
option go_package = "github.com/envoyproxy/go-control-plane/envoy/extensions/transport_sockets/reality/v3;realityv3";
option (udpa.annotations.file_status).package_version_status = ACTIVE;

// [#protodoc-title: REALITY TLS Mirror]
// [#extension: envoy.tls_handshakers.reality]

// REALITY implements a TLS mirror server that presents another server's
// ServerHello fingerprint while performing its own key exchange. This is
// configured as a ``custom_handshaker`` inside a
// :ref:`DownstreamTlsContext <envoy_v3_api_msg_extensions.transport_sockets.tls.v3.DownstreamTlsContext>`.
//
// The handshaker declares ``provides_certificates``, so Envoy will not load
// TLS certificates into the SSL_CTX — the handshaker injects a per-connection
// temporary trusted certificate instead.
message RealityConfig {
  // X25519 private key used for REALITY auth key exchange, as base64url (Go
  // RawURLEncoding, i.e. the string printed by ``xray x25519`` / sing-box).
  // Decodes to 32 raw bytes. The corresponding public key is distributed to
  // REALITY clients. Same encoding as the naive client and sing-box, so one
  // string is reused verbatim across the whole deployment.
  string private_key = 1 [(validate.rules).string = {min_len: 1}];

  // Short ID that the client must present in the encrypted session_id, as a hex
  // string (Xray/sing-box convention), decoding to 1..8 bytes. Connections with
  // a mismatched short_id are rejected.
  string short_id = 2 [(validate.rules).string = {min_len: 1}];

  // Static fallback mirror ServerHello handshake message (raw bytes, including
  // the 4-byte handshake header). Captured beforehand from the real target.
  // Used when ``mirror_target`` is unset, or as a fallback when a live capture
  // fails. The handshaker emits this verbatim (only key_share ciphertext is
  // replaced with the server's own) to match the target's TLS fingerprint.
  //
  // At least one of ``mirror_server_hello`` or ``mirror_target`` must be set.
  bytes mirror_server_hello = 3;

  // Maximum allowed absolute difference (in seconds) between the timestamp
  // embedded in the client's encrypted session_id and the server's current
  // time. Rejects stale/replayed ClientHellos. Mirrors REALITY's MaxTimeDiff.
  // If 0, defaults to 90 seconds. Set to a large value to effectively disable.
  uint32 max_time_diff_seconds = 4;

  // Live mirror target, e.g. ``www.apple.com:443``. When set, the handshaker
  // dials this target during the (suspended) handshake, captures its real
  // ServerHello live, and injects that — eliminating the fingerprint drift that
  // a static ``mirror_server_hello`` accrues as the real target changes. The
  // dial runs asynchronously on the connection's dispatcher (the handshake is
  // suspended via ssl_select_cert_retry, so no worker thread is blocked). If
  // the live capture fails, the handshaker falls back to ``mirror_server_hello``
  // when present. Host is used as the SNI presented to the target.
  string mirror_target = 5;

  // Timeout (seconds) for the live mirror dial + ServerHello capture. If 0,
  // defaults to 5 seconds. On timeout the handshaker falls back to
  // ``mirror_server_hello`` (or fails the connection if none is set).
  uint32 mirror_dial_timeout_seconds = 6;
}
