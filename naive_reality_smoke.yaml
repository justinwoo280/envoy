# Minimal smoke config for the NaiveProxy-REALITY Envoy server.
#
# Purpose: verify `envoy-min --mode validate -c naive_reality_smoke.yaml`
# loads (all allowlisted extensions resolve), then serve real traffic for the
# end-to-end stress test. Replace every <PLACEHOLDER> before live use.
#
# Data path: TLS listener -> tls_inspector -> HCM(h2) -> naive_forward_proxy.
# REALITY replaces the downstream TLS handshake via custom_handshaker.

admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }

static_resources:
  listeners:
  - name: reality_listener
    address:
      socket_address: { address: 0.0.0.0, port_value: 8443 }
    listener_filters:
    - name: envoy.filters.listener.tls_inspector
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.filters.listener.tls_inspector.v3.TlsInspector
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: naive
          codec_type: HTTP2
          route_config:
            name: local
            virtual_hosts:
            - name: naive
              domains: ["*"]
              routes:
              - match: { connect_matcher: {} }
                route: { cluster: dummy, upgrade_configs: [{ upgrade_type: CONNECT, connect_config: {} }] }
          http_filters:
          - name: envoy.filters.http.naive_forward_proxy
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.naive_forward_proxy.v3.NaiveForwardProxy
              username: "<USERNAME>"
              password: "<PASSWORD>"
              fast_open: true
              max_padding_size: 256
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
          common_tls_context:
            # REALITY handshaker declares provides_certificates, so no
            # tls_certificates are configured here — it injects its own.
            custom_handshaker:
              name: envoy.tls_handshakers.reality
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.transport_sockets.reality.v3.RealityConfig
                private_key: "<BASE64_RAW_32B_X25519_PRIVATE_KEY>"
                short_id: "<BASE64_SHORT_ID_UP_TO_8B>"
                mirror_server_hello: "<BASE64_CAPTURED_SERVERHELLO_BYTES>"
                max_time_diff_seconds: 90

  # Dummy cluster so HCM/router config validation passes. The naive filter
  # returns StopIteration and builds its own upstream, so this is not on the
  # real data path — it exists only to satisfy config validation while router
  # is kept. (Candidate for removal in the staged-trim step; see runbook.)
  clusters:
  - name: dummy
    type: STATIC
    load_assignment:
      cluster_name: dummy
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: 127.0.0.1, port_value: 1 }
